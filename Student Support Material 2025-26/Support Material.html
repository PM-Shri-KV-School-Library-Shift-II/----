<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; frame-src 'none'; object-src 'none'; connect-src 'self'; base-uri 'self'; form-action 'none'">
    <title>Student Support Material 2025-26</title>
    <meta name="description" content="Download subject-wise Student Support Material 2025-26 PDFs for Classes IX to XII from the PM SHRI KV Aliganj (Shift II) Library.">
    <link rel="icon" type="image/png" href="../LOGO/KV-LOGO.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --light-bg: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-light: #6b7280;
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: #9aa4b2 #ffffff;
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
        }
        ::-webkit-scrollbar-thumb {
            background: #9aa4b2;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .file-explorer {
            padding: 20px;
        }

        .breadcrumb-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 15px;
            background: #ecf0f1;
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .back-button {
            display: none;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 15px;
            margin-right: 15px;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .back-button i {
            font-size: 14px;
        }

        .breadcrumb {
            flex: 1;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            display: inline;
            cursor: pointer;
            color: var(--secondary-color);
            transition: var(--transition);
            padding: 5px 0;
        }

        .breadcrumb-item:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .breadcrumb-item.active {
            color: var(--primary-color);
            font-weight: bold;
            cursor: default;
        }

        .breadcrumb-separator {
            margin: 0 10px;
            color: var(--text-light);
            font-size: 14px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); /* wider cards for names+buttons */
            gap: 15px;
            animation: fadeIn 0.5s ease;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #e9ecef;
            position: relative;
            overflow: hidden;
            /* fixes: allow wrapping so names don't collapse */
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: transparent;
            transition: var(--transition);
        }

        .file-item:hover {
            background: #e9ecef;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .file-item:hover::before {
            background: var(--secondary-color);
        }

        .file-icon {
            font-size: 28px;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }

        .folder-icon {
            color: var(--warning-color);
        }

        .pdf-icon {
            color: var(--danger-color);
        }

        .zip-icon {
            color: #8e44ad;
        }

        .file-info {
            flex: 1 1 220px;   /* flexible, but keeps room for names */
            min-width: 220px;  /* prevents name collapsing to 0 */
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 12px;
            color: var(--text-light);
        }

        .file-actions {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;      /* buttons keep natural width */
            margin-left: auto;   /* push actions to right */
        }

        .open-btn, .download-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .open-btn {
            background: var(--secondary-color);
            color: white;
        }

        .open-btn:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        .download-btn {
            background: var(--accent-color);
            color: white;
        }

        .download-btn:hover {
            background: #229954;
            transform: scale(1.05);
        }

        .download-btn[disabled] {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #bdc3c7;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            color: var(--text-light);
            font-size: 14px;
            border-top: 1px solid #e9ecef;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                border-radius: 0;
                margin: -15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .file-grid {
                grid-template-columns: 1fr;
            }

            .breadcrumb-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .back-button {
                margin-bottom: 10px;
                margin-right: 0;
            }

            .file-actions {
                width: 100%;
            }

            .open-btn, .download-btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .file-item {
                text-align: center;
            }

            .file-icon {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .file-actions {
                margin-top: 10px;
            }
        }

        /* Loading animation */
        .loading {
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: var(--secondary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Visible keyboard focus (WCAG 2.4.7) */
        .skip-link:focus-visible,
        button:focus-visible,
        a:focus-visible,
        [role="button"]:focus-visible {
            outline: 3px solid var(--secondary-color);
            outline-offset: 2px;
        }


        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 9999;
            padding: 12px 18px;
            background: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            border-radius: 0 0 6px 0;
            text-decoration: none;
        }


        .skip-link:focus {
            left: 0;
        }


        .noscript-warning {
            margin: 0;
            padding: 14px 20px;
            background: #fdecea;
            color: #8a1f11;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    <noscript><div class="noscript-warning"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i> This page needs JavaScript to browse and download the files. Please enable it.</div></noscript>

    <main class="container" id="main-content" tabindex="-1">
        <div class="header">
            <h1>Student Support Material 2025-26</h1>
            <p>Educational Resources for Academic Excellence</p>
        </div>

        <div class="file-explorer">
            <div class="breadcrumb-container">
                <button type="button" id="backButton" class="back-button" aria-label="Go back">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i> Back
                </button>
                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item active" data-path="">Home</span>
                </div>
            </div>

            <div id="fileList" role="region" aria-label="Files" tabindex="-1"></div>
        </div>

        <div class="footer">
            © 2025-26 Student Support Material. All rights reserved.
        </div>
    </main>

    <!-- JSZip for folder download -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"></script>

    <script src="Support Material.js" defer></script>
</body>
</html>
