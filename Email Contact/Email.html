<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact the PM SHRI KV Aliganj (Shift II) Library - open the email app or Gmail, or copy our email address.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B">

    <link rel="icon" href="../LOGO/KV-LOGO.png">
    <style>
        /* ─── Contact-specific overrides ─── */
        body {
            background: linear-gradient(160deg, #f0f4ff 0%, #e8edf5 40%, #fafbfc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .contact-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 60px;
        }

        .contact-card {
            max-width: 680px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 48px 40px;
            text-align: center;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .contact-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 24px rgba(30, 58, 95, 0.25);
        }

        .contact-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .contact-card .subtitle {
            color: var(--gray-500);
            font-size: 1rem;
            margin-bottom: 36px;
        }

        .contact-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 3px;
            margin: 0 auto 32px;
        }

        .contact-card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 24px;
        }

        .email-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .email-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(30, 58, 95, 0.25);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .email-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(30, 58, 95, 0.35);
        }

        .email-link:active {
            transform: translateY(0);
        }

        .email-link i {
            font-size: 1.1rem;
        }

        .email-display {
            margin-top: 8px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.6);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--gray-100);
        }

        .email-address {
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
            color: var(--gray-700);
            font-size: 0.95rem;
            word-break: break-all;
        }

        .copy-btn {
            padding: 8px 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .copy-btn.copied {
            background: var(--success);
        }

        .platform-hint {
            font-size: 0.82rem;
            color: var(--gray-500);
            margin-top: 4px;
            width: 100%;
        }

        .back-home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            color: var(--gray-500);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease, gap 0.2s ease;
        }

        .back-home-link:hover {
            color: var(--accent-dark);
            gap: 12px;
        }

        @media (max-width: 600px) {
            .contact-card {
                padding: 32px 20px;
            }
            .contact-card h1 {
                font-size: 1.5rem;
            }
            .email-link {
                padding: 14px 20px;
                font-size: 0.9rem;
            }
            .email-display {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .copy-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

        <a href="../index.html" class="back-home-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Home</a>
